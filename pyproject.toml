[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["frontend-src"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP", "W"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "RUF005", "RUF012"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
combine-as-imports = true
known-first-party = ["custom_components"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    # dependencies, not ours: HA's HomeAssistantApplication(web.Application), backoff on Python 3.14
    "ignore:Inheritance class HomeAssistantApplication:DeprecationWarning",
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:backoff",
]
