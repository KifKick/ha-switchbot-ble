name: Release

# Push a tag "v<version>" (the version in manifest.json) to publish a release:
#   git tag v1.0.1 && git push origin v1.0.1
# A tag with a suffix (v1.1.0-beta.1) becomes a pre-release.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    name: Publish
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Tag matches manifest.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(jq -r .version custom_components/ha_switchbot_ble/manifest.json)"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest.json version $version"
            exit 1
          fi

      - name: Build ha_switchbot_ble.zip
        run: |
          cd custom_components/ha_switchbot_ble
          zip -r -q "$GITHUB_WORKSPACE/ha_switchbot_ble.zip" . -x "*/__pycache__/*" "*.pyc"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" ha_switchbot_ble.zip \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag "${flags[@]}"
